name: Build FlixLeo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'src/lib/androidNative.ts'
      - 'src/components/Player/**'
      - '.github/workflows/build-flixleo-android.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - 'src/lib/androidNative.ts'
      - 'src/components/Player/**'
      - '.github/workflows/build-flixleo-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using preinstalled sdkmanager
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify installable Android APK
        run: |
          set -eu
          APK=android-native/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "APK size: $(du -h "$APK" | cut -f1)"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libvlc.so' || {
            echo 'Native LibVLC libraries not packaged in APK'; exit 1;
          }
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8
      - uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-Android-debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Validate Android Studio Gradle wrapper and package project
        run: |
          set -eu
          test -s android-native/gradle/wrapper/gradle-wrapper.jar
          bash android-native/gradlew --version | grep 'Gradle 8.10.2'
          zip -qr FlixLeo-AndroidStudio-Source.zip android-native \
            -x 'android-native/.gradle/*' 'android-native/app/build/*' 'android-native/build/*'
          unzip -l FlixLeo-AndroidStudio-Source.zip | grep 'android-native/app/src/main/java/cyou/flixleo/android/NativeUi.kt'
      - uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-AndroidStudio-Source
          path: FlixLeo-AndroidStudio-Source.zip
          if-no-files-found: error
