name: Build FlixLeo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - 'src/**'
      - 'server/**'
      - 'server.ts'
      - 'public/**'
      - '.github/workflows/build-flixleo-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using preinstalled sdkmanager
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Remove duplicate legacy launcher icon
        run: |
          # Logo 2.0 uses flixleo_brand.png; Android sees WebP and PNG as one resource.
          rm -f android-native/app/src/main/res/drawable/flixleo_brand.webp
      # Rebuild after movie-title visibility and VLC playback fixes.
      - name: Build Android debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Show APK size and SHA-256
        run: |
          ls -lh android-native/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-Android-debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
