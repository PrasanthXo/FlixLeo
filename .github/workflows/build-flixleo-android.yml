name: Build FlixLeo Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/build-flixleo-android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        working-directory: android-native
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s android-native/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-Android-debug-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
