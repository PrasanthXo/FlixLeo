name: Build FlixLeo Windows App
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-flixleo-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Package installer and portable Windows app
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check generated Windows executables
        shell: pwsh
        run: |
          Get-ChildItem desktop-release -Recurse -File | Select-Object FullName, Length
          $exes = @(Get-ChildItem desktop-release -Filter '*.exe' -File)
          if ($exes.Count -lt 2) { throw "Expected installer and portable EXE but found $($exes.Count)" }
      - uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-Windows
          path: desktop-release/*.exe
          if-no-files-found: error
