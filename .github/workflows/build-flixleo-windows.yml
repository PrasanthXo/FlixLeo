name: Build FlixLeo Windows App
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-flixleo-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download verified bundled mpv decoder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Authenticate to avoid the GitHub-hosted runner's shared anonymous API limit.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'FlixLeo-Windows-Build'
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/20261012' -Headers $headers -TimeoutSec 45
          $asset = @($release.assets | Where-Object { $_.name -eq 'mpv-x86_64-20261012-git-88eb9f2e73.7z' }) | Select-Object -First 1
          if (-not $asset) { throw 'Pinned Windows x64 mpv build not found' }
          New-Item -ItemType Directory -Force desktop/vendor/mpv | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.7z
          $actual = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          $expected = ($asset.digest -replace '^sha256:', '').ToLower()
          if ($expected -ne 'cc57a4ee7c72de9b3ad877a0e85afec9e81fc906c0248ee548f003efe360cf2b' -or $actual -ne $expected) { throw 'mpv archive SHA256 mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x mpv.7z '-odesktop/vendor/mpv' -y | Out-Null
          $exe = Get-ChildItem desktop/vendor/mpv -Filter mpv.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'mpv executable missing from downloaded build' }
          if ($exe.DirectoryName -ne (Resolve-Path desktop/vendor/mpv).Path) { Copy-Item $exe.FullName desktop/vendor/mpv/mpv.exe -Force }
          Write-Host 'Bundled mpv SHA256 validated.'
      - name: Compile Windows in-app video embedding helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "$env:WINDIR\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe"
          if (-not (Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler not found' }
          $source = (Resolve-Path 'desktop/win32/FlixLeoEmbed.cs' -ErrorAction Stop).Path
          $destination = Join-Path (Resolve-Path 'desktop/vendor/mpv').Path 'FlixLeoEmbed.exe'
          # Pass source and output paths in a response file so Windows PowerShell,
          # the legacy .NET Framework compiler and path separators cannot mangle them.
          $response = Join-Path $env:RUNNER_TEMP 'flixleo-embed.rsp'
          @(
            '/nologo'
            '/target:exe'
            '/platform:x64'
            ('/out:"' + $destination + '"')
            ('"' + $source + '"')
          ) | Set-Content -LiteralPath $response -Encoding Ascii
          & $compiler ("@" + $response)
          if ($LASTEXITCODE -ne 0) { throw "Unable to compile FlixLeo native embedding helper (csc exit $LASTEXITCODE)" }
          if (-not (Test-Path desktop/vendor/mpv/FlixLeoEmbed.exe)) { throw 'Embedding helper missing' }
      - name: Validate Electron scripts before packaging
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
      - name: Build FlixLeo installer and portable Windows EXEs (unsigned)
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate installers and generate SHA256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = @("FlixLeo-Setup-$version-x64.exe", "FlixLeo-Portable-$version-x64.exe")
          $exes = @(Get-ChildItem desktop-release -File -Filter '*.exe')
          if ($exes.Count -ne 2) { throw "Expected two Windows EXEs, found $($exes.Count)." }
          if (-not (Test-Path 'desktop-release/win-unpacked/FlixLeo.exe')) {
            throw 'Native FlixLeo executable is missing from packaged files.'
          }
          $manifest = @()
          foreach ($name in $expected) {
            $file = Join-Path 'desktop-release' $name
            if (-not (Test-Path $file)) { throw "Windows build missing $name" }
            if ((Get-Item $file).Length -lt 40000000) {
              throw "$name is unexpectedly small."
            }
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -notin @('NotSigned', 'Valid')) {
              throw "Unexpected Windows signature status for $name : $($signature.Status)"
            }
            Write-Host "$name Authenticode status: $($signature.Status)"
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifest += "$hash  $name"
          }
          $manifest | Set-Content -Path desktop-release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem desktop-release -File | Select-Object Name, Length
          Get-Content desktop-release/SHA256SUMS.txt

      - name: Archive Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-Windows-Installer-And-Portable
          path: |
            desktop-release/FlixLeo-Setup-*.exe
            desktop-release/FlixLeo-Portable-*.exe
            desktop-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish latest FlixLeo Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid release version' }
          $tag = "windows-v$version"
          $installer = "desktop-release/FlixLeo-Setup-$version-x64.exe"
          $portable = "desktop-release/FlixLeo-Portable-$version-x64.exe"
          $assets = @($installer, $portable, 'desktop-release/SHA256SUMS.txt')
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) { throw "Cannot publish missing asset: $asset" }
          }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "FlixLeo Windows $version" --notes "FlixLeo Windows x64. FlixLeo-Setup installs the app and creates Desktop and Start Menu shortcuts. FlixLeo-Portable runs without installation. Both EXEs are UNSIGNED because no Authenticode certificate is available, so Windows may show an Unknown Publisher warning. SHA256SUMS.txt contains the hashes of both binaries." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish FlixLeo Windows release' }
          Write-Host "Published FlixLeo Windows $version installer and portable EXE."
