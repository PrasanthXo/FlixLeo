name: Build FlixLeo Windows App
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-flixleo-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download verified bundled mpv decoder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Authenticate to avoid the GitHub-hosted runner's shared anonymous API limit.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'FlixLeo-Windows-Build'
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/20261012' -Headers $headers -TimeoutSec 45
          $asset = @($release.assets | Where-Object { $_.name -eq 'mpv-x86_64-20261012-git-88eb9f2e73.7z' }) | Select-Object -First 1
          if (-not $asset) { throw 'Pinned Windows x64 mpv build not found' }
          New-Item -ItemType Directory -Force desktop/vendor/mpv | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.7z
          $actual = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          $expected = ($asset.digest -replace '^sha256:', '').ToLower()
          if ($expected -ne 'cc57a4ee7c72de9b3ad877a0e85afec9e81fc906c0248ee548f003efe360cf2b' -or $actual -ne $expected) { throw 'mpv archive SHA256 mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x mpv.7z '-odesktop/vendor/mpv' -y | Out-Null
          $exe = Get-ChildItem desktop/vendor/mpv -Filter mpv.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'mpv executable missing from downloaded build' }
          if ($exe.DirectoryName -ne (Resolve-Path desktop/vendor/mpv).Path) { Copy-Item $exe.FullName desktop/vendor/mpv/mpv.exe -Force }
          Write-Host 'Bundled mpv SHA256 validated.'
      - name: Compile Windows in-app video embedding helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "$env:WINDIR\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe"
          if (-not (Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler not found' }
          $source = (Resolve-Path 'desktop/win32/FlixLeoEmbed.cs' -ErrorAction Stop).Path
          $destination = Join-Path (Resolve-Path 'desktop/vendor/mpv').Path 'FlixLeoEmbed.exe'
          # Pass source and output paths in a response file so Windows PowerShell,
          # the legacy .NET Framework compiler and path separators cannot mangle them.
          $response = Join-Path $env:RUNNER_TEMP 'flixleo-embed.rsp'
          @(
            '/nologo'
            '/target:exe'
            '/platform:x64'
            ('/out:"' + $destination + '"')
            ('"' + $source + '"')
          ) | Set-Content -LiteralPath $response -Encoding Ascii
          & $compiler ("@" + $response)
          if ($LASTEXITCODE -ne 0) { throw "Unable to compile FlixLeo native embedding helper (csc exit $LASTEXITCODE)" }
          if (-not (Test-Path desktop/vendor/mpv/FlixLeoEmbed.exe)) { throw 'Embedding helper missing' }
      - name: Validate Electron scripts before packaging
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
      - name: Build FlixLeo portable Windows EXE (unsigned)
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify portable EXE and calculate SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = "FlixLeo-Portable-$version-x64.exe"
          $executables = @(Get-ChildItem desktop-release -File -Filter '*.exe')
          if ($executables.Count -ne 1 -or $executables[0].Name -ne $expected) {
            throw "Expected exactly one portable EXE named $expected"
          }
          $portable = $executables[0]
          if ($portable.Length -lt 40000000) { throw 'Portable app is unexpectedly small' }
          $appExe = 'desktop-release/win-unpacked/FlixLeo.exe'
          if (-not (Test-Path $appExe)) { throw 'Embedded FlixLeo application binary is missing' }
          $signature = Get-AuthenticodeSignature -FilePath $portable.FullName
          Write-Host "Code-signing status: $($signature.Status); portable binary intentionally unsigned."
          if ($signature.Status -notin @('NotSigned', 'Valid')) {
            throw "Unexpected portable executable signature status: $($signature.Status)"
          }
          $hash = (Get-FileHash -Path $portable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $expected" | Set-Content -Path desktop-release/SHA256SUMS.txt -Encoding ascii
          Write-Host "SHA256: $hash"
          Get-ChildItem desktop-release -File | Select-Object Name, Length

      - name: Save portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlixLeo-Windows-Portable
          path: |
            desktop-release/FlixLeo-Portable-*.exe
            desktop-release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish portable Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Invalid version' }
          $tag = "windows-v$version"
          $exe = "desktop-release/FlixLeo-Portable-$version-x64.exe"
          if (-not (Test-Path $exe)) { throw 'Portable EXE missing before publishing' }
          $assets = @($exe, 'desktop-release/SHA256SUMS.txt')
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "FlixLeo Windows Portable $version" --notes "FlixLeo Windows x64 portable executable: double-click to run without installation. The app is unsigned because no code-signing certificate is available. Windows may warn Unknown Publisher. See SHA256SUMS.txt to verify your download." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish portable release to GitHub' }
          Write-Host "Published FlixLeo Portable $version and checksum."
