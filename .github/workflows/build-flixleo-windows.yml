name: Build FlixLeo Windows App
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-flixleo-windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download verified bundled mpv decoder
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Authenticate to avoid the GitHub-hosted runner's shared anonymous API limit.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'FlixLeo-Windows-Build'
          }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/20261012' -Headers $headers -TimeoutSec 45
          $asset = @($release.assets | Where-Object { $_.name -eq 'mpv-x86_64-20261012-git-88eb9f2e73.7z' }) | Select-Object -First 1
          if (-not $asset) { throw 'Pinned Windows x64 mpv build not found' }
          New-Item -ItemType Directory -Force desktop/vendor/mpv | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv.7z
          $actual = (Get-FileHash mpv.7z -Algorithm SHA256).Hash.ToLower()
          $expected = ($asset.digest -replace '^sha256:', '').ToLower()
          if ($expected -ne 'cc57a4ee7c72de9b3ad877a0e85afec9e81fc906c0248ee548f003efe360cf2b' -or $actual -ne $expected) { throw 'mpv archive SHA256 mismatch' }
          & 'C:\Program Files\7-Zip\7z.exe' x mpv.7z '-odesktop/vendor/mpv' -y | Out-Null
          $exe = Get-ChildItem desktop/vendor/mpv -Filter mpv.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw 'mpv executable missing from downloaded build' }
          if ($exe.DirectoryName -ne (Resolve-Path desktop/vendor/mpv).Path) { Copy-Item $exe.FullName desktop/vendor/mpv/mpv.exe -Force }
          Write-Host 'Bundled mpv SHA256 validated.'
      - name: Compile Windows in-app video embedding helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "$env:WINDIR\\Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe"
          if (-not (Test-Path $compiler)) { throw 'Windows .NET Framework C# compiler not found' }
          $source = (Resolve-Path 'desktop/win32/FlixLeoEmbed.cs' -ErrorAction Stop).Path
          $destination = Join-Path (Resolve-Path 'desktop/vendor/mpv').Path 'FlixLeoEmbed.exe'
          # Pass source and output paths in a response file so Windows PowerShell,
          # the legacy .NET Framework compiler and path separators cannot mangle them.
          $response = Join-Path $env:RUNNER_TEMP 'flixleo-embed.rsp'
          @(
            '/nologo'
            '/target:exe'
            '/platform:x64'
            ('/out:"' + $destination + '"')
            ('"' + $source + '"')
          ) | Set-Content -LiteralPath $response -Encoding Ascii
          & $compiler ("@" + $response)
          if ($LASTEXITCODE -ne 0) { throw "Unable to compile FlixLeo native embedding helper (csc exit $LASTEXITCODE)" }
          if (-not (Test-Path desktop/vendor/mpv/FlixLeoEmbed.exe)) { throw 'Embedding helper missing' }
      - name: Validate Electron scripts before packaging
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
      - name: Prepare Windows Authenticode signing certificate
        shell: pwsh
        env:
          FLIXLEO_PFX_BASE64: ${{ secrets.FLIXLEO_WINDOWS_PFX_BASE64 }}
          FLIXLEO_PFX_PASSWORD: ${{ secrets.FLIXLEO_WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FLIXLEO_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:FLIXLEO_PFX_PASSWORD)) {
            throw 'SIGNING_NOT_CONFIGURED: Add FLIXLEO_WINDOWS_PFX_BASE64 and FLIXLEO_WINDOWS_PFX_PASSWORD as GitHub Actions secrets. A real trusted code-signing certificate is required.'
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'flixleo-windows-signing.pfx'
          [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:FLIXLEO_PFX_BASE64))
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certPath, $env:FLIXLEO_PFX_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
          if (-not $certificate.HasPrivateKey -or $certificate.NotAfter -lt (Get-Date) -or
              $certificate.NotBefore -gt (Get-Date)) {
            throw 'Signing PFX must contain a currently valid code-signing certificate and private key.'
          }
          Write-Host 'Windows signing certificate loaded securely (private key not displayed).'
      - name: Package and Authenticode-sign Windows installer
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ runner.temp }}/flixleo-windows-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.FLIXLEO_WINDOWS_PFX_PASSWORD }}
      - name: Check generated Windows executables
        shell: pwsh
        run: |
          Get-ChildItem desktop-release -Recurse -File | Select-Object FullName, Length
          $exes = @(Get-ChildItem desktop-release -Filter '*.exe' -File)
          if ($exes.Count -ne 1 -or $exes[0].Name -notlike 'FlixLeo-Setup-*.exe') { throw "Expected one FlixLeo installer EXE but found $($exes.Count)" }
      - name: Verify trusted Windows Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem desktop-release -File -Filter 'FlixLeo-Setup-*.exe')
          if ($installer.Count -ne 1) { throw 'Signed installer missing or ambiguous' }
          $application = Join-Path (Resolve-Path desktop-release/win-unpacked).Path 'FlixLeo.exe'
          if (-not (Test-Path $application)) { throw 'Packaged FlixLeo application EXE is missing.' }
          foreach ($file in @($application, $installer[0].FullName)) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid') {
              throw "AUTHENTICODE_VERIFICATION_FAILED: $([System.IO.Path]::GetFileName($file)) signature is $($signature.Status). Refusing to publish an unsigned or untrusted Windows EXE."
            }
            Write-Host "$([System.IO.Path]::GetFileName($file)) Authenticode verified: Valid"
          }
          (Get-FileHash $installer[0].FullName -Algorithm SHA256) | Format-List Hash
      - uses: actions/upload-artifact@v5
        with:
          name: FlixLeo-Windows-Signed
          path: desktop-release/FlixLeo-Setup-*.exe
          if-no-files-found: error
      - name: Publish verified Windows installer to latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\\d+\\.\\d+\\.\\d+
) { throw 'Invalid Windows release version' }
          $tag = "windows-v$version"
          $installer = @(Get-ChildItem desktop-release -File -Filter "FlixLeo-Setup-$version-x64.exe")
          if ($installer.Count -ne 1) { throw 'Expected exact signed Windows installer not found' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer[0].FullName --clobber
          } else {
            gh release create $tag $installer[0].FullName --target $env:GITHUB_SHA --title "FlixLeo Windows $version" --notes "FlixLeo for Windows x64. The installer and application executable are Authenticode-signed and verified by Windows during release. Includes desktop and Start Menu shortcuts." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the verified Windows installer' }
          Write-Host "Signed Windows $version installer published to GitHub Releases."
