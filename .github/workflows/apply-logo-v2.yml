name: Apply FlixLeo Logo 2.0 everywhere
on:
  push:
    paths:
      - 'branding/flixleo-icon-v2.png'
      - 'branding/flixleo-icon-v2.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts sharp@0.34.4
      - run: node scripts/apply-logo-v2.cjs
      - name: Commit generated icons and branding links
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A public index.html src/components/Header/Navbar.tsx android-native/app/src/main/res/drawable desktop/brand-icon.png
          git diff --cached --quiet || (git commit -m 'Apply Logo 2.0 across FlixLeo branding and icons' && git push origin HEAD:main)
