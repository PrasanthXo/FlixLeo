name: FlixLeo Render Keepalive

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping FlixLeo Render
        run: |
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 5 \
            --output /dev/null \
            --write-out "FlixLeo Render HTTP %{http_code}\n" \
            https://flixleo.onrender.com/
