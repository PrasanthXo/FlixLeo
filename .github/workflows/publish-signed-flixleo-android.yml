name: Build and publish signed FlixLeo Android APK
# Legacy workflow disabled: signing is managed by private FlixLeo-Android-Releases.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools and SDK 35
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
            mkdir -p "$RUNNER_TEMP/android-tools"
            unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
            mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          set -o pipefail
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Load signing keystore from secret
        env:
          KS_B64: ${{ secrets.FLIXLEO_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FLIXLEO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLIXLEO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FLIXLEO_KEY_PASSWORD }}
          RELEASE_TOKEN: ${{ secrets.FLIXLEO_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS RELEASE_TOKEN; do
            test -n "${!v}" || { echo "Missing signing or private releases secret: $v"; exit 1; }
          done
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/flixleo-release.jks"
          chmod 600 "$RUNNER_TEMP/flixleo-release.jks"
          echo "FLIXLEO_KEYSTORE_PATH=$RUNNER_TEMP/flixleo-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android-native
        env:
          FLIXLEO_KEYSTORE_PASSWORD: ${{ secrets.FLIXLEO_KEYSTORE_PASSWORD }}
          FLIXLEO_KEY_ALIAS: ${{ secrets.FLIXLEO_KEY_ALIAS }}
          FLIXLEO_KEY_PASSWORD: ${{ secrets.FLIXLEO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version_code=$((100 + GITHUB_RUN_NUMBER))
          gradle --no-daemon :app:assembleRelease -PflixleoVersionCode="$version_code" -PflixleoVersionName="1.5.$GITHUB_RUN_NUMBER"
      - name: Verify signing and prepare release file
        run: |
          set -euo pipefail
          apk=android-native/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose "$apk"
          mkdir -p release-output
          cp "$apk" "release-output/FlixLeo-Android-v1.5.$GITHUB_RUN_NUMBER-signed.apk"
          sha256sum release-output/*.apk
      - name: Publish into private releases repository
        env:
          GH_TOKEN: ${{ secrets.FLIXLEO_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          tag="android-v1.5.$GITHUB_RUN_NUMBER"
          gh release create "$tag" release-output/*.apk --repo PrasanthXo/FlixLeo-Android-Releases --title "FlixLeo Android v1.5.$GITHUB_RUN_NUMBER" --notes "Native Android signed release. Requires same signing certificate for upgrades." 
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/flixleo-release.jks"
